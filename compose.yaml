name: crm-platform

services:
  mailpit:
    image: axllent/mailpit:v1.30.4
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - crm_internal

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_platform}
      POSTGRES_USER: ${POSTGRES_USER:-crm_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro
    ports:
      - "5432:5432"
    networks:
      - crm_internal

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    environment:
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crm_internal

  backend:
    build:
      context: ./backend
      target: development
    environment:
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://crm_platform:development-only@database:5432/crm_platform}
      EMAIL_BACKEND: smtp
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-development@crm.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CRM Platform}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_STARTTLS: "false"
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_MODEL: ${AI_MODEL:-}
      AI_OLLAMA_URL: ${AI_OLLAMA_URL:-http://ollama:11434}
      AI_OLLAMA_LOCAL_CONFIRMED: ${AI_OLLAMA_LOCAL_CONFIRMED:-true}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AI_ANTHROPIC_API_KEY: ${AI_ANTHROPIC_API_KEY:-}
      AI_GEMINI_API_KEY: ${AI_GEMINI_API_KEY:-}
      AI_CREDENTIALS_ENCRYPTION_KEY: ${AI_CREDENTIALS_ENCRYPTION_KEY:-development-only-ai-key-change-before-production}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-180}
      AI_CACHE_TTL_SECONDS: ${AI_CACHE_TTL_SECONDS:-900}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_internal

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-CRM Platform}
    command: npm run dev
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_internal

volumes:
  postgres_data:
  ollama_data:

networks:
  crm_internal:
    driver: bridge
