name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in .env.production}

x-backend-environment: &backend-environment
  APP_ENV: production
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-crm_session}
  CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-crm_csrf}
  SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-28800}
  INVITATION_LIFETIME_SECONDS: ${INVITATION_LIFETIME_SECONDS:-259200}
  FRONTEND_PUBLIC_URL: ${CRM_PUBLIC_URL:?Set CRM_PUBLIC_URL in .env.production}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-disabled}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-crm@example.com}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-CRM Platform}
  SMTP_HOST: ${SMTP_HOST:-localhost}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  AI_PROVIDER: ${AI_PROVIDER:-disabled}
  AI_MODEL: ${AI_MODEL:-}
  AI_CREDENTIALS_ENCRYPTION_KEY: ${AI_CREDENTIALS_ENCRYPTION_KEY:?Set AI_CREDENTIALS_ENCRYPTION_KEY in .env.production}
  AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-45}
  AI_COOLDOWN_SECONDS: ${AI_COOLDOWN_SECONDS:-30}
  AI_CACHE_TTL_SECONDS: ${AI_CACHE_TTL_SECONDS:-900}

services:
  gateway:
    image: ${CADDY_IMAGE:-caddy:2.11.4-alpine}
    restart: unless-stopped
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?Set CRM_DOMAIN in .env.production}
    ports:
      - "${CRM_HTTP_PORT:-80}:80"
      - "${CRM_HTTPS_PORT:-443}:443"
      - "${CRM_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - public

  frontend:
    image: ${CRM_FRONTEND_IMAGE:?Set CRM_FRONTEND_IMAGE in .env.production}
    restart: unless-stopped
    init: true
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - frontend_cache:/app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public
      - private

  backend:
    image: ${CRM_BACKEND_IMAGE:?Set CRM_BACKEND_IMAGE in .env.production}
    restart: unless-stopped
    init: true
    environment: *backend-environment
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - private
      - outbound

  migrate:
    image: ${CRM_BACKEND_IMAGE:?Set CRM_BACKEND_IMAGE in .env.production}
    init: true
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      database:
        condition: service_healthy
    networks:
      - private

  database:
    image: ${POSTGRES_IMAGE:-postgres:17.10-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_platform}
      POSTGRES_USER: ${POSTGRES_USER:-crm_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    networks:
      - private

volumes:
  postgres_data:
  frontend_cache:
  caddy_data:
  caddy_config:

networks:
  public:
  private:
    internal: true
  outbound:
